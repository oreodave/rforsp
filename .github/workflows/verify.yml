name: Verify

on:
  pull_request:
    branches:
      - compiler
  push:
    branches:
      - compiler

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run verification
        run: ./scripts/verify
